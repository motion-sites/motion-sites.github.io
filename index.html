<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Motion Sites</title>
<meta name="description" content="Онлайн-курс: анимированные сайты, веб-гайды и мини-приложения с ИИ — без программирования. Примеры работ, программа и тарифы.">
<meta name="theme-color" content="#1A0709">
<meta property="og:title" content="Motion Sites — анимированные сайты с ИИ">
<meta property="og:description" content="Из PDF в анимированный гайд, лендинг, сайт и мини-приложение. Без программирования.">
<meta property="og:image" content="https://motion-sites.github.io/img/d-dp.jpg">
<meta property="og:url" content="https://motion-sites.github.io/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231A0709'/%3E%3Cpath d='M16 44V22l16 16 16-16v22' fill='none' stroke='%23E6AE9E' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Marck+Script&family=Caveat:wght@600;700&family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#1A0709; --bg2:#22090C; --card:#330E14; --card2:#3E1219; --ink:#F6E7E1; --muted:#C79E97; --line:#4D1C22;
  --moss:#E6AE9E; --moss-ink:#1A0709; --leaf:#7A1C26; --glow:#F6CDBD;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --script:"Marck Script", "Cormorant Garamond", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;overflow-x:clip;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6;overflow-x:hidden;overflow-x:clip;position:relative;text-align:center;
  background-image:radial-gradient(90% 50% at 100% 0%, #5A1220 0%, transparent 60%),radial-gradient(80% 40% at 0% 40%, #3A0B13 0%, transparent 60%),radial-gradient(90% 40% at 100% 80%, #4A0E19 0%, transparent 60%)}
img{max-width:100%;display:block}
a{color:inherit}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-right,0px)) 140px max(18px,env(safe-area-inset-left,0px));position:relative;z-index:1}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--moss);font-weight:700}
section{padding-block:56px;position:relative}
.muted{color:var(--muted)}
.lead{color:var(--muted);max-width:60ch;margin:12px auto 0;text-wrap:pretty}

/* ghost headings */
.gh{position:relative;padding-top:34px;margin-bottom:10px}
.gh .ghost{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-family:var(--script);font-size:clamp(56px,15vw,104px);line-height:1;color:var(--ink);opacity:.08;white-space:nowrap;pointer-events:none;animation:driftc 14s ease-in-out infinite alternate}
.gh h2{font-size:clamp(34px,8vw,52px);font-style:italic;position:relative;line-height:1.05}
.gh h2 em{color:var(--moss)}
@keyframes driftc{from{transform:translateX(-53%)}to{transform:translateX(-47%)}}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;padding-block:16px;position:sticky;top:0;z-index:15;margin-inline:-18px;padding-inline:18px;transition:background .3s, backdrop-filter .3s}
.top.solid{background:rgba(26,7,9,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo svg{width:34px;height:34px}
.logo b{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.04em;font-style:italic}
.nav{display:none;gap:24px;font-size:13.5px;font-weight:600}
.nav a{text-decoration:none;color:var(--muted);transition:color .2s}
.nav a:hover{color:var(--ink)}
.pill{border:1px solid var(--moss);color:var(--moss);background:transparent;border-radius:99px;padding:9px 18px;font:700 13px var(--body);text-decoration:none;cursor:pointer;transition:.2s;white-space:nowrap}
.pill:hover{background:var(--moss);color:var(--moss-ink)}

/* buttons */
.btn{border:0;border-radius:99px;background:var(--moss);color:var(--moss-ink);font:800 15px var(--body);padding:15px 26px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .2s, box-shadow .25s}
.btn:hover{box-shadow:0 0 0 7px rgba(230,174,158,.16);transform:translateY(-1px)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line);font-family:var(--display);font-size:20px;font-weight:700;font-style:italic;padding:11px 24px}
.btn.line:hover{border-color:var(--moss)}
.btn.sm{padding:10px 16px;font-size:13px}
.btn.wa{background:#25A35A;color:#fff}
.btn svg{width:18px;height:18px}
:is(.btn,.pill,.chip,.q,.tab,.ex,.totop):focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:24px}

/* blobs */
.blob{position:relative;overflow:hidden;border-radius:58% 42% 55% 45% / 46% 56% 44% 54%;animation:morph 16s ease-in-out infinite alternate;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.blob img{width:100%;height:100%;object-fit:cover}
@keyframes morph{0%{border-radius:58% 42% 55% 45% / 46% 56% 44% 54%}50%{border-radius:42% 58% 40% 60% / 58% 42% 58% 42%}100%{border-radius:52% 48% 62% 38% / 40% 60% 46% 54%}}
@keyframes bob{to{transform:translateY(-10px)}}

/* hero */
.hero{padding-top:18px;display:grid;gap:34px;align-items:center}
.hero-txt{position:relative}
.hero-txt .ghost{font-family:var(--script);font-size:clamp(78px,24vw,150px);line-height:.8;opacity:.09;position:absolute;top:-6px;left:50%;transform:translateX(-50%);pointer-events:none;white-space:nowrap}
.hero h1{font-size:clamp(50px,14vw,88px);line-height:.95;font-style:italic;position:relative;margin-top:12px}
.hero h1 em{color:var(--moss)}
.hero .sub{font-family:var(--display);font-size:clamp(21px,5vw,27px);font-weight:600;font-style:italic;margin-top:12px;color:var(--glow)}
.hero-txt p.lead{font-size:16px}
.typer{display:inline-block;min-width:1ch;color:var(--moss);border-right:2px solid var(--moss);padding-right:3px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{border-color:transparent}}
.hero-pic{position:relative;width:min(100%,460px);margin:0 auto;aspect-ratio:1/1.02}
.hero-pic .blob{position:absolute;inset:4% 0 10% 10%}
.phone{position:absolute;width:40%;aspect-ratio:9/17.5;left:0;bottom:0;border-radius:30px;background:#0D0304;border:1px solid #6E2A31;padding:7px;box-shadow:0 30px 60px -18px rgba(0,0,0,.9),0 0 0 6px rgba(26,7,9,.9);animation:bob 6s ease-in-out infinite alternate;z-index:2}
.phone .scr{position:relative;width:100%;height:100%;border-radius:23px;overflow:hidden;background:#000}
.phone .scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity 1s ease, transform 6s ease;transform:scale(1.06)}
.phone .scr img.on{opacity:1;transform:scale(1)}
.phone::before{content:"";position:absolute;top:13px;left:50%;width:30%;height:5px;border-radius:9px;background:#0D0304;transform:translateX(-50%);z-index:3}
.tag{position:absolute;background:rgba(26,7,9,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:12px;color:var(--muted);z-index:3;text-align:center}
.tag b{display:block;font-family:var(--display);font-size:24px;font-weight:700;color:var(--glow);line-height:1.1}
.tag.t1{right:0;top:6%;animation:bob 7s ease-in-out infinite alternate-reverse}
.tag.t2{right:6%;bottom:6%;animation:bob 8s ease-in-out infinite alternate}
.hero-cap{font-size:12px;color:var(--muted);margin-top:10px}
.hero-cap b{color:var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.stat{border-top:1px solid var(--line);padding-top:14px}
.stat b{display:block;font-family:var(--display);font-size:clamp(34px,9vw,48px);font-weight:700;line-height:1;color:var(--ink)}
.stat span{font-size:12.5px;color:var(--muted)}

/* marquee of works */
.marq{overflow:hidden;margin-inline:-18px;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq-in{display:flex;gap:14px;width:max-content;animation:marq 48s linear infinite}
.marq:hover .marq-in{animation-play-state:paused}
.marq a{flex:0 0 auto;width:150px;aspect-ratio:9/16;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 40px -20px rgba(0,0,0,.8);transition:transform .3s}
.marq a:hover{transform:translateY(-6px)}
.marq img{width:100%;height:100%;object-fit:cover;object-position:top}
@keyframes marq{to{transform:translateX(-50%)}}

/* compare */
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0 24px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:10px 18px;font:700 13.5px var(--body);cursor:pointer;transition:.2s}
.tab[aria-selected="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss);box-shadow:0 0 24px rgba(230,174,158,.3)}
.cmp{display:grid;gap:26px;align-items:center}
.slider{position:relative;width:min(100%,340px);margin:0 auto;aspect-ratio:420/776;border-radius:34px;overflow:hidden;border:1px solid #6E2A31;box-shadow:0 0 0 7px #0D0304,0 0 0 8px #6E2A31,0 40px 70px -25px rgba(0,0,0,.9);user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:ew-resize;background:#000}
.slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;pointer-events:none}
.slider .after{clip-path:inset(0 0 0 var(--x,50%))}
.slider .bar-v{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:var(--glow);transform:translateX(-1px);box-shadow:0 0 14px rgba(246,205,189,.8);pointer-events:none}
.slider .knob{position:absolute;top:50%;left:var(--x,50%);width:48px;height:48px;border-radius:50%;background:var(--glow);color:var(--moss-ink);transform:translate(-50%,-50%);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none;animation:pulse 2.4s ease-in-out infinite}
.slider .knob svg{width:24px;height:24px}
@keyframes pulse{50%{box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 0 10px rgba(246,205,189,.18)}}
.lbl{position:absolute;top:14px;padding:5px 11px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lbl.l{left:12px;background:rgba(0,0,0,.55);color:#fff}
.lbl.r{right:12px;background:rgba(230,174,158,.9);color:var(--moss-ink)}
.slider input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp-txt h3{font-size:clamp(30px,7vw,40px);font-style:italic;line-height:1.05}
.cmp-txt .lead{margin-top:10px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px auto 0;max-width:520px;text-align:left}
.vs div{background:rgba(51,14,20,.7);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px}
.vs div.b{border-color:rgba(230,174,158,.55);background:rgba(230,174,158,.08)}
.vs h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.vs .b h4{color:var(--moss)}
.vs ul{list-style:none;margin:0;padding:0;font-size:13.5px;display:grid;gap:6px}
.vs li{display:flex;gap:7px;align-items:flex-start;line-height:1.35}
.vs li::before{content:"–";color:var(--muted);flex:0 0 auto}
.vs .b li::before{content:"✦";color:var(--moss);font-size:11px;margin-top:2px}
.cmp-txt .cta-row{margin-top:18px}
.cmp-wrap.swap{animation:fadein .45s ease}
@keyframes fadein{from{opacity:.2;transform:translateY(8px)}}

/* program */
.mods{display:grid;gap:16px;margin-top:26px;text-align:left;counter-reset:m}
.mod{position:relative;background:rgba(51,14,20,.72);border:1px solid var(--line);border-radius:26px;padding:22px 20px 20px;overflow:hidden;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .35s, border-color .35s}
.mod:hover{transform:translateY(-4px);border-color:rgba(230,174,158,.6)}
.mod::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(246,205,189,.09) 50%,transparent 65%);transform:translateX(-100%);transition:transform .9s;pointer-events:none}
.mod:hover::after{transform:translateX(100%)}
.mod .no{position:absolute;right:16px;top:4px;font-family:var(--display);font-style:italic;font-weight:700;font-size:86px;line-height:1;color:var(--ink);opacity:.07;pointer-events:none}
.mod .hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mod .ic{flex:0 0 auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#5E1C25,var(--card));border:1px solid rgba(230,174,158,.5);color:var(--glow)}
.mod .ic svg{width:24px;height:24px}
.mod .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--moss);font-weight:800}
.mod h3{font-size:27px;font-style:italic;line-height:1.05}
.mod p{color:var(--muted);font-size:14px}
.free{display:inline-block;margin-left:6px;background:var(--glow);color:var(--moss-ink);border-radius:99px;padding:2px 9px;font:800 10.5px var(--body);letter-spacing:.08em;vertical-align:middle;font-style:normal}
.exs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ex{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:5px 13px 5px 5px;font-size:12.5px;font-weight:700;transition:.2s}
.ex:hover{border-color:var(--moss);color:var(--moss)}
.ex img{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:top}
.ex .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--glow);font-size:13px}

/* works gallery */
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0 22px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:8px 15px;font:700 13px var(--body);cursor:pointer;transition:.2s}
.chip[aria-pressed="true"]{color:var(--moss-ink);background:var(--moss);border-color:var(--moss)}
.works{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.w{position:relative;text-decoration:none;display:block;transition:opacity .4s, transform .4s}
.w.hide{display:none}
.w .arch{border-radius:999px 999px 22px 22px;overflow:hidden;aspect-ratio:9/15;border:1px solid var(--line);position:relative;box-shadow:0 26px 50px -28px rgba(0,0,0,.9)}
.w .arch img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform 1.2s ease}
.w:hover .arch img{transform:scale(1.06)}
.w .arch::after{content:"Открыть ↗";position:absolute;left:50%;bottom:12px;transform:translate(-50%,10px);opacity:0;background:var(--moss);color:var(--moss-ink);font:800 12px var(--body);padding:7px 14px;border-radius:99px;transition:.3s;white-space:nowrap}
.w:hover .arch::after,.w:focus-visible .arch::after{opacity:1;transform:translate(-50%,0)}
.w b{display:block;font-family:var(--display);font-style:italic;font-size:21px;font-weight:700;margin-top:10px;line-height:1.1}
.w span{font-size:12px;color:var(--muted)}
.w:nth-child(even){margin-top:34px}

/* quote */
.quote{font-family:var(--display);font-size:clamp(32px,7.5vw,54px);line-height:1.08;font-weight:600;text-wrap:balance;max-width:20ch;margin:0 auto}
.quote em{color:var(--moss);font-style:italic}

/* for whom */
.who{display:grid;gap:14px;margin-top:26px}
.who > div{background:rgba(51,14,20,.6);border:1px solid var(--line);border-radius:24px;padding:24px 20px}
.who .ic{width:54px;height:54px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(230,174,158,.5);color:var(--glow);background:radial-gradient(circle at 35% 30%,#5E1C25,var(--card))}
.who .ic svg{width:26px;height:26px}
.who h3{font-size:25px;font-style:italic}
.who p{color:var(--muted);font-size:14px;margin-top:6px}

/* publish steps */
.steps{display:grid;gap:12px;max-width:640px;margin:26px auto 0;text-align:left}
.step{display:flex;gap:14px;align-items:flex-start;background:rgba(51,14,20,.6);border:1px solid var(--line);border-radius:20px;padding:16px}
.step i{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--moss);color:var(--moss-ink);display:grid;place-items:center;font:800 14px var(--body);font-style:normal}
.step b{display:block;font-size:15px}
.step span{font-size:13.5px;color:var(--muted)}

/* pricing */
.plans{display:grid;gap:16px;margin-top:28px;align-items:stretch}
.plan{position:relative;background:rgba(51,14,20,.75);border:1px solid var(--line);border-radius:30px;padding:30px 22px 24px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.plan.hot{border-color:var(--moss);background:linear-gradient(180deg,rgba(230,174,158,.14),rgba(51,14,20,.8) 45%);box-shadow:0 0 0 1px rgba(230,174,158,.3),0 30px 70px -30px rgba(230,174,158,.35)}
.plan .badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--glow);color:var(--moss-ink);font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:99px;white-space:nowrap}
.plan h3{font-size:34px;font-style:italic}
.plan .pr{font-family:var(--display);font-weight:700;font-size:52px;line-height:1;color:var(--ink)}
.plan .pr small{font-size:22px}
.plan .old{color:var(--muted);text-decoration:line-through;font-size:15px;font-weight:600}
.plan .note{font-size:12.5px;color:var(--glow)}
.plan ul{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:9px;text-align:left;font-size:14px}
.plan li{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.plan li svg{flex:0 0 auto;width:18px;height:18px;color:var(--moss);margin-top:1px}
.plan li.no{color:var(--muted);opacity:.65}
.plan li.no svg{color:var(--muted)}
.plan .btn{margin-top:auto;width:100%}
.inst{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.inst b{color:var(--ink)}
.seats{display:flex;gap:4px;justify-content:center;margin-top:2px}
.seats i{width:12px;height:12px;border-radius:50%;background:var(--moss);box-shadow:0 0 8px rgba(230,174,158,.6)}
.seats i.t{background:var(--line);box-shadow:none}
.later{max-width:640px;margin:26px auto 0;font-size:13.5px;color:var(--muted)}
.later b{color:var(--ink)}

/* faq */
.faq{max-width:720px;margin:26px auto 0;text-align:left;border-top:1px solid var(--line)}
.q{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:18px 4px;display:flex;justify-content:space-between;gap:14px;align-items:center;font:700 15.5px var(--body);text-align:left;cursor:pointer}
.q span.pl{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--moss);color:var(--moss);display:grid;place-items:center;font-size:18px;transition:transform .3s, background .3s}
.q[aria-expanded="true"] span.pl{transform:rotate(45deg);background:var(--moss);color:var(--moss-ink)}
.a{overflow:hidden;max-height:0;transition:max-height .45s ease;color:var(--muted);font-size:14.5px}
.a p{padding:4px 4px 18px}

/* final */

.about{border-top:1px solid var(--line)}
.hero{border-top:0!important}

/* v14: views like Ayla */
[hidden]{display:none!important}
.view{display:none}
.view.on{display:block;animation:viewIn 1.1s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}}
.ph1{padding-top:22px}
.lessons{display:grid;gap:16px;margin-top:26px}
.les{background:rgba(51,14,20,.6);border:1px solid var(--line);border-radius:24px;padding:12px 12px 18px;display:flex;flex-direction:column;gap:8px;align-items:center}
.yt{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:0;padding:0;background:#000;cursor:pointer}
.yt img{width:100%;height:100%;object-fit:cover;transition:transform .8s,opacity .3s;opacity:.85}
.yt:hover img{transform:scale(1.04);opacity:1}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;left:50%;top:50%;width:64px;height:64px;border-radius:50%;transform:translate(-50%,-50%);background:var(--moss);box-shadow:0 0 0 10px rgba(230,174,158,.25);animation:pl 2.2s ease-in-out infinite}
.play::after{content:"";position:absolute;left:26px;top:20px;border-left:18px solid var(--moss-ink);border-top:12px solid transparent;border-bottom:12px solid transparent}
@keyframes pl{50%{box-shadow:0 0 0 18px rgba(230,174,158,.05)}}
.badge3{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;background:var(--moss);color:var(--moss-ink);display:grid;place-items:center;font:800 18px var(--body)}
.les b{font-family:var(--display);font-style:italic;font-size:23px;margin-top:6px}
.les .ls{font-size:13.5px;color:var(--muted);max-width:40ch}
.pdfcard{display:grid;gap:18px;align-items:center;margin:26px auto 0;max-width:820px;background:linear-gradient(160deg,rgba(230,174,158,.14),rgba(51,14,20,.6));border:1px solid rgba(230,174,158,.4);border-radius:28px;padding:20px}
.pdfcard img{width:min(220px,60%);margin:0 auto;border-radius:12px;box-shadow:0 24px 40px -20px rgba(0,0,0,.9);transform:rotate(-3deg);transition:transform .5s}
.pdfcard:hover img{transform:rotate(0) scale(1.03)}
.pdfcard h3{font-size:30px;font-style:italic;margin-top:6px}
.pdfcard p{color:var(--muted);margin:8px auto 14px;max-width:46ch}
.servs{display:grid;gap:14px;margin-top:24px}
.sv{background:rgba(51,14,20,.65);border:1px solid var(--line);border-radius:26px;padding:24px 20px;display:flex;flex-direction:column;gap:10px;align-items:center;transition:transform .35s,border-color .35s}
.sv:hover{transform:translateY(-4px);border-color:rgba(230,174,158,.6)}
.sv h3{font-size:28px;font-style:italic}
.sv .pr{font-family:var(--display);font-weight:700;font-size:30px;color:var(--glow);line-height:1}
.sv p{color:var(--muted);font-size:14px;max-width:36ch}
.sv .ex{margin-top:2px}
.sv .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
@media (min-width:760px){.lessons{grid-template-columns:repeat(3,1fr)}.pdfcard{grid-template-columns:260px 1fr;text-align:left}.pdfcard p{margin-left:0}.servs{grid-template-columns:1fr 1fr;max-width:900px;margin-inline:auto}}

.old2{color:var(--muted);font-size:.55em;font-weight:600;text-decoration:line-through;vertical-align:middle}
.plist li.fr{border-style:dashed}

/* v16: calm motion + prompt->site demo */
.gh .ghost{animation-duration:26s!important;opacity:.06!important}
.hero-txt > *{animation-duration:1.5s!important}
.hero-txt > :nth-child(2){animation-delay:.2s!important}.hero-txt > :nth-child(3){animation-delay:.45s!important}.hero-txt > :nth-child(4){animation-delay:.7s!important}.hero-txt > :nth-child(5){animation-delay:.95s!important}.hero-txt > :nth-child(6){animation-delay:1.2s!important}
.play{animation-duration:4.5s!important;box-shadow:0 0 0 8px rgba(230,174,158,.12)!important}
.btn:hover{box-shadow:0 0 0 6px rgba(230,174,158,.08)!important}
.mod::after,.card::after{display:none}
.ic.ph{width:64px!important;height:64px!important;padding:0;overflow:hidden;border:2px solid rgba(230,174,158,.45)!important;background:none!important}
.ic.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.demo{position:relative;width:min(100%,420px);margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:0;animation:inUp 1.6s ease .5s both}
.dchat{display:flex;align-items:flex-end;gap:10px;align-self:flex-start;max-width:92%}
.dav{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(230,174,158,.18);color:var(--glow);font-size:15px;border:1px solid var(--line)}
.dbub{background:rgba(51,14,20,.85);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:15px;font-weight:600;color:var(--ink);text-align:left;min-height:46px;min-width:120px}
.caret{display:inline-block;width:2px;height:1em;background:var(--moss);vertical-align:-2px;margin-left:2px;animation:caret 1.2s steps(1) infinite}
.dlink{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0}
.dlink i{width:4px;height:4px;border-radius:50%;background:var(--moss);opacity:.25}
.demo.go .dlink i{animation:flow 1.8s ease-in-out infinite}
.demo.go .dlink i:nth-child(2){animation-delay:.3s}.demo.go .dlink i:nth-child(3){animation-delay:.6s}
@keyframes flow{50%{opacity:.8}}
.dsite{width:100%;aspect-ratio:4/3.1;border-radius:20px;border:1px solid var(--line);background:rgba(26,7,9,.7);padding:12px;display:flex;flex-direction:column;gap:9px;overflow:hidden;box-shadow:0 30px 60px -34px rgba(0,0,0,.9)}
.dsite > *{opacity:0;transform:translateY(10px);transition:opacity 1.1s ease,transform 1.1s ease}
.dsite.on > *{opacity:1;transform:none}
.dsite.on > :nth-child(2){transition-delay:.7s}.dsite.on > :nth-child(3){transition-delay:1.4s}.dsite.on > :nth-child(4){transition-delay:2.1s}
.dbar{display:flex;align-items:center;gap:5px}
.dbar i{width:7px;height:7px;border-radius:50%;background:rgba(230,174,158,.35)}
.dbar span{margin-left:auto;width:34%;height:7px;border-radius:9px;background:rgba(230,174,158,.18)}
.dhero{flex:1;border-radius:14px;background:linear-gradient(135deg,var(--dc1,rgba(230,174,158,.22)),rgba(51,14,20,.4));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:background 1.5s}
.dhero b{width:58%;height:12px;border-radius:9px;background:rgba(246,231,225,.55)}
.dhero em{width:38%;height:8px;border-radius:9px;background:rgba(246,231,225,.25)}
.dhero .dbtn{width:26%;height:16px;border-radius:99px;background:var(--moss);opacity:.85;margin-top:4px}
.dcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dcards i{aspect-ratio:1.3;border-radius:10px;background:rgba(230,174,158,.12);border:1px solid var(--line)}
.dfoot{display:flex;justify-content:space-between}.dfoot span{width:30%;height:6px;border-radius:9px;background:rgba(230,174,158,.12)}
@media (prefers-reduced-motion:reduce){.dsite > *{opacity:1;transform:none}}

/* ===== v17: Montserrat headings, medallions, lively home, works carousel, calculator ===== */
h1,h2,h3,.gh h2,.offer,.btn.line,.les b,.plist b,.pdfcard h3,.final h2,.sv h3,.plan h3,.me-name,.ms b{font-family:"Montserrat",var(--body)!important;font-style:normal!important;letter-spacing:-.01em}
.gh h2{font-size:clamp(25px,6.2vw,40px)!important;font-weight:800!important;line-height:1.15!important}
.gh h2 em,.offer em,.final h2 em{font-style:normal!important}
.offer{font-size:clamp(29px,7.4vw,50px)!important;font-weight:800!important;line-height:1.12!important}
.hero .sub{font-family:"Montserrat",var(--body)!important;font-style:normal!important;font-weight:600!important;font-size:clamp(15px,3.8vw,19px)!important}
.btn.line{font-size:15px!important;font-weight:700!important;padding:13px 22px!important}
.final h2{font-weight:800;font-size:clamp(24px,6vw,36px)!important}
.plan h3{font-size:24px!important;font-weight:800}
.me-name{font-weight:800!important;font-size:clamp(34px,9vw,56px)!important}
.les b{font-size:18px!important;font-weight:700}
/* medallion icon */
.md{position:relative;flex:0 0 auto;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--glow);background:radial-gradient(circle at 30% 25%,#5A1A24,#1E070B 70%);box-shadow:inset 0 0 0 1px rgba(246,205,189,.28),0 12px 26px -14px #000}
.md svg{width:24px;height:24px;position:relative;z-index:1}
.md::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,rgba(246,205,189,.55) 75%,transparent 95%);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%);mask:radial-gradient(circle,transparent 63%,#000 64%);animation:mdspin 14s linear infinite;opacity:.7}
@keyframes mdspin{to{transform:rotate(360deg)}}
/* how it works */
.how{position:relative;max-width:440px;margin:0 auto;width:100%;text-align:left;display:flex;flex-direction:column;gap:12px;padding-left:28px;animation:inUp 1.6s ease .6s both}
.how-h{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--moss);font-weight:800;margin-left:-28px;text-align:center}
.how-line{position:absolute;left:6px;top:46px;bottom:32px;width:2px;background:var(--line);border-radius:2px}
.how-line i{position:absolute;left:0;top:0;width:100%;height:0;background:linear-gradient(var(--glow),var(--moss));border-radius:2px;transition:height 2.4s ease}
.hs{display:flex;gap:14px;align-items:center;background:rgba(51,14,20,.55);border:1px solid var(--line);border-radius:20px;padding:14px;opacity:.5;transition:opacity 1.4s ease,border-color 1.4s ease,transform 1.4s ease,background 1.4s ease}
.hs.on{opacity:1;border-color:rgba(230,174,158,.55);background:rgba(70,20,28,.7);transform:translateX(4px)}
.hs b{display:block;font-family:"Montserrat",var(--body);font-weight:700;font-size:16px}
.hs span{font-size:13px;color:var(--muted)}
/* timeline */
.tl{max-width:760px;margin:26px auto 0;padding:26px 18px 18px;border:1px solid var(--line);border-radius:26px;background:rgba(51,14,20,.5)}
.tl-bar{position:relative;height:8px;border-radius:9px;background:linear-gradient(90deg,rgba(230,174,158,.15),rgba(230,174,158,.08));margin:18px 6px 18px}
.tl-fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--moss),rgba(140,26,40,.9));transition:width 3s ease}
.tl.in .tl-fill{width:100%}
.tl-me{position:absolute;left:14%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;background:var(--glow);color:var(--moss-ink);font:800 11px var(--body);padding:5px 10px;border-radius:99px;box-shadow:0 0 0 6px rgba(246,205,189,.12);animation:mepulse 4s ease-in-out infinite}
@keyframes mepulse{50%{box-shadow:0 0 0 12px rgba(246,205,189,.03)}}
.tl-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tl-steps b{display:block;font-family:"Montserrat",var(--body);font-weight:800;font-size:15px}
.tl-steps span{font-size:12.5px;color:var(--muted);line-height:1.4;display:block;margin-top:2px}
.tl-steps div:first-child b{color:var(--glow)}
.pts{list-style:none;padding:0;margin:18px auto 0;max-width:760px;display:grid;gap:10px;text-align:left}
.pts li{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding:12px 4px}
.pts i{font-style:normal;font-family:"Montserrat",var(--body);font-weight:800;color:var(--moss);font-size:18px;flex:0 0 auto}
.pts p{font-size:15px}
/* market bars */
.mk{max-width:760px;margin:24px auto 0;display:grid;gap:14px;text-align:left}
.mk-row b{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14.5px;margin-bottom:6px}
.mk-row b em{font-style:normal;color:var(--glow);font-variant-numeric:tabular-nums}
.mk-bar{height:12px;border-radius:9px;background:rgba(230,174,158,.08);position:relative;overflow:hidden}
.mk-bar i{position:absolute;top:0;bottom:0;left:var(--a,0%);width:0;border-radius:9px;background:linear-gradient(90deg,var(--moss),#B8475A);transition:width 2.6s cubic-bezier(.2,.7,.2,1)}
.mk.in .mk-bar i{width:var(--w)}
.mk-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-4px}
.note2{font-size:12px;color:var(--muted);margin-top:12px}
/* gain checks */
.gi.ck svg{flex:0 0 auto;width:36px;height:36px;fill:none;stroke:var(--moss);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gi.ck svg path{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset 1.6s ease .6s}
.gi.ck:not(.pre) svg path{stroke-dashoffset:0}
/* roles */
.roles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.role{border:1px solid var(--line);background:rgba(51,14,20,.5);color:var(--ink);border-radius:99px;padding:10px 16px;font:700 13.5px var(--body);cursor:pointer;transition:.4s}
.role[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.rpanel{max-width:640px;margin:18px auto 0;display:grid;gap:10px;text-align:left}
.rp{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:16px;background:rgba(51,14,20,.55);animation:fadein 1s ease both}
.rp:nth-child(2){animation-delay:.25s}
.rp small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--moss);font-weight:800}
.rp p{font-size:15px;font-weight:600;margin-top:2px}
/* works carousel */
.wk{margin:10px -18px 0;overflow:hidden}
.wk-track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 18px 18px;scrollbar-width:none;scroll-behavior:smooth}
.wk-track::-webkit-scrollbar{display:none}
.wkc{flex:0 0 clamp(210px,62vw,250px);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.wkc.hide{display:none}
.dev{position:relative;width:100%;aspect-ratio:9/18.5;border-radius:34px;background:#0D0304;padding:9px;box-shadow:0 0 0 1px #6E2A31,0 34px 60px -28px rgba(0,0,0,.95);transition:transform 1s ease}
.dev::before{content:"";position:absolute;top:16px;left:50%;width:30%;height:5px;border-radius:9px;background:#0D0304;transform:translateX(-50%);z-index:2}
.dev .scr{width:100%;height:100%;border-radius:26px;overflow:hidden}
.dev img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform 6s ease,opacity 1s ease}
.wkc:hover .dev{transform:translateY(-6px)}
.wkc:hover .dev img{transform:translateY(-6%)}
.wkc .t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--moss);font-weight:800}
.wkc b{font-family:"Montserrat",var(--body);font-weight:700;font-size:17px;text-align:center;line-height:1.2}
.wkc .go{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:6px 14px}
.arws{display:flex;gap:10px;justify-content:center;margin-top:8px}
.arw{width:44px;height:44px;border-radius:50%;border:1px solid var(--moss);background:transparent;color:var(--moss);cursor:pointer;display:grid;place-items:center;transition:.3s}
.arw:hover{background:var(--moss);color:var(--moss-ink)}
.arw svg{width:18px;height:18px}
/* services list + calculator + order */
.plist2{max-width:720px;margin:22px auto 0;border-top:1px solid var(--line);text-align:left}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:16px 4px;border-bottom:1px solid var(--line)}
.sl b{font-family:"Montserrat",var(--body);font-weight:700;font-size:17px}
.sl .pr2{font-weight:800;color:var(--glow);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.sl .pr2 small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.sl .pr2 s{color:var(--muted);font-weight:600;font-size:12px;display:block}
.sl span{grid-column:1/-1;font-size:13px;color:var(--muted)}
.sl a{grid-column:1/-1;font-size:12.5px;color:var(--moss);font-weight:700;text-decoration:none;margin-top:4px}
.calc{max-width:720px;margin:30px auto 0;text-align:left;background:rgba(51,14,20,.6);border:1px solid rgba(230,174,158,.35);border-radius:28px;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.calc h3{font-size:22px;font-weight:800;text-align:center}
.cl-row label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:9px 14px;font:700 13px var(--body);cursor:pointer;transition:.3s}
.opt[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.cb{display:flex!important;align-items:center;gap:10px;color:var(--ink)!important;font-size:14px!important;font-weight:600!important;margin:0 0 8px!important;cursor:pointer}
.cb input{width:20px;height:20px;accent-color:var(--moss);flex:0 0 auto}
input[type=range]{width:100%;accent-color:var(--moss)}
.cl-tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:14px;font-weight:700}
.cl-tot b{font-family:"Montserrat",var(--body);font-size:30px;font-weight:800;color:var(--glow);font-variant-numeric:tabular-nums}
.order input,.order textarea{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}
.order label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
.two2{display:grid;gap:12px}
@media (min-width:760px){.two2{grid-template-columns:1fr 1fr}.how{padding-left:30px}}
@media (prefers-reduced-motion:reduce){.md::before{animation:none}.tl-fill,.mk-bar i{transition:none}}

/* v18: results tiles, program tree, services plaque */
.res{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:820px;margin:22px auto 0}
.rs{position:relative;background:rgba(51,14,20,.6);border:1px solid var(--line);border-radius:22px;padding:20px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.rs b{font-family:"Montserrat",var(--body);font-weight:800;font-size:16px}
.rs span{font-size:12.5px;color:var(--muted);line-height:1.4}
.rs .ok{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--moss);color:var(--moss-ink);font:800 12px var(--body);font-style:normal;display:grid;place-items:center;transform:scale(0);transition:transform 1s cubic-bezier(.3,1.6,.5,1) .8s}
.rs:not(.pre) .ok{transform:scale(1)}
.res-foot{font-size:14px;font-weight:600;color:var(--glow);margin-top:16px}
.tree{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.tree-root{position:relative;padding:14px 34px;border-radius:99px;border:1px solid rgba(246,205,189,.55);background:linear-gradient(160deg,rgba(230,174,158,.22),rgba(51,14,20,.8));box-shadow:0 0 0 6px rgba(230,174,158,.06),0 0 40px rgba(230,174,158,.18)}
.tree-root span{font-family:"Montserrat",var(--body);font-weight:800;font-size:clamp(20px,5vw,28px);letter-spacing:.02em}
.tree-trunk{width:2px;height:34px;background:linear-gradient(rgba(246,205,189,.7),rgba(230,174,158,.35))}
.tree-kids{list-style:none;margin:0;padding:22px 0 0;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:26px 12px;width:100%;max-width:900px}
.tree-kids::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:rgba(230,174,158,.35)}
.tree-kids li{position:relative;background:rgba(51,14,20,.62);border:1px solid var(--line);border-radius:22px;padding:18px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .8s,transform .8s}
.tree-kids li:hover{border-color:rgba(230,174,158,.6);transform:translateY(-3px)}
.tree-kids li::before{content:"";position:absolute;left:50%;top:-23px;width:2px;height:22px;background:rgba(230,174,158,.35)}
.tree-kids li.fr{grid-column:1/-1;max-width:360px;justify-self:center;width:100%;border-style:dashed}
.tree-kids li.fr::before{top:-23px}
.tree-kids small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--moss);font-weight:800}

   const s=1.12-ad*.22,ry=Math.max(-1,Math.min(1,d))*-28;c.style.transform=`scale(${s}) rotateY(${ry}deg)`;c.style.opacity=String(1-ad*.32);c.style.zIndex=String(10-Math.round(ad*3));
   if(Math.abs(d)<bd){bd=Math.abs(d);best=c}});

/* router */
const ALIAS={top:"home",myth:"home",gain:"course",who:"home",why:"home",market:"home",how:"home",program:"course",price:"course",faq:"course",examples:"works"};
let rio=null;
document.querySelectorAll(".rs .md svg *").forEach(e=>e.setAttribute("pathLength","1"));
function revealView(v){if(reduce||!("IntersectionObserver" in window)||!v)return;if(rio)rio.disconnect();
  rio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove("pre");rio.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"});
  let k=0;v.querySelectorAll(".rv").forEach(el=>{if(el.getBoundingClientRect().top>innerHeight*.92){el.classList.add("pre");el.style.transitionDelay=((el.matches(".les,.sv,.w,.gi,.who > div,.pts li,.rs")?(k++%4):0)*90)+"ms";rio.observe(el)}else el.classList.remove("pre")})}
function route(){let raw=(location.hash||"#home").slice(1),v=ALIAS[raw]||raw;if(!NAV.some(n=>n[0]===v))v="home";
  document.querySelectorAll(".view").forEach(el=>el.classList.toggle("on",el.dataset.v===v));
  secnav.querySelectorAll("a").forEach(a=>{const act=a.dataset.s===v;a.classList.toggle("on",act);if(act){a.setAttribute("aria-current","page");const r=a.getBoundingClientRect(),nr=secnav.getBoundingClientRect();if(r.left<nr.left+10||r.right>nr.right-10)secnav.scrollLeft+=r.left-nr.left-(nr.width-r.width)/2}else a.removeAttribute("aria-current")});
  const tgt=ALIAS[raw]&&raw!=="top"?document.getElementById(raw):null;
  if(tgt){requestAnimationFrame(()=>{revealView(document.querySelector(".view.on"));window.scrollTo({top:tgt.getBoundingClientRect().top+scrollY-(hdr.offsetHeight+10),behavior:reduce?"auto":"smooth"})})}
  else{window.scrollTo({top:0,behavior:"instant"});requestAnimationFrame(()=>revealView(document.querySelector(".view.on")))}
  setTimeout(coverflow,60);onS()}
addEventListener("hashchange",route);

/* living background: dim orbs + slowly falling laptops, phones and AI sparkles linked together */
(function(){const cv=document.getElementById("sky"),x=cv.getContext("2d");let w,h,dpr,t=0;
 function rs(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
 rs();addEventListener("resize",rs);
 const orbs=[{x:.85,y:.15,r:.45,c:"230,174,158",a:.06,s:.00012},{x:.1,y:.55,r:.4,c:"246,205,189",a:.035,s:.0001},{x:.7,y:.9,r:.5,c:"140,26,40",a:.12,s:.00008}];
 const N=innerWidth<700?7:12,types=["laptop","phone","ai","phone","laptop","ai","phone"];
 const items=Array.from({length:N},(_,i)=>({k:types[i%types.length],x:Math.random(),y:Math.random(),s:(innerWidth<700?16:20)+Math.random()*14,v:.05+Math.random()*.08,r:(Math.random()-.5)*.5,vr:(Math.random()-.5)*.0012,a:.09+Math.random()*.07}));
 function rr(cx,cy,ww,hh,rad){x.beginPath();x.moveTo(cx+rad,cy);x.arcTo(cx+ww,cy,cx+ww,cy+hh,rad);x.arcTo(cx+ww,cy+hh,cx,cy+hh,rad);x.arcTo(cx,cy+hh,cx,cy,rad);x.arcTo(cx,cy,cx+ww,cy,rad);x.closePath()}
 function shape(it){const s=it.s;x.lineWidth=1.2;x.lineJoin="round";
  if(it.k==="laptop"){rr(-s*.8,-s*.55,s*1.6,s*1.0,3);x.stroke();x.beginPath();x.moveTo(-s*1.05,s*.55);x.lineTo(s*1.05,s*.55);x.lineTo(s*.9,s*.72);x.lineTo(-s*.9,s*.72);x.closePath();x.stroke();
    x.beginPath();x.moveTo(-s*.45,-s*.15);x.lineTo(s*.25,-s*.15);x.moveTo(-s*.45,s*.12);x.lineTo(s*.05,s*.12);x.stroke()}
  else if(it.k==="phone"){rr(-s*.42,-s*.8,s*.84,s*1.6,s*.16);x.stroke();x.beginPath();x.moveTo(-s*.12,-s*.64);x.lineTo(s*.12,-s*.64);x.stroke();
    rr(-s*.26,-s*.38,s*.52,s*.4,3);x.stroke()}
  else{const q=s*.55;x.beginPath();x.moveTo(0,-q);x.quadraticCurveTo(q*.12,-q*.12,q,0);x.quadraticCurveTo(q*.12,q*.12,0,q);x.quadraticCurveTo(-q*.12,q*.12,-q,0);x.quadraticCurveTo(-q*.12,-q*.12,0,-q);x.closePath();x.stroke()}}
 function draw(){t+=16;x.clearRect(0,0,w,h);x.shadowBlur=0;
  orbs.forEach((o,i)=>{const ox=(o.x+Math.sin(t*o.s+i)*.06)*w,oy=(o.y+Math.cos(t*o.s*1.3+i)*.05)*h,r=o.r*Math.max(w,h);
   const g=x.createRadialGradient(ox,oy,0,ox,oy,r);g.addColorStop(0,`rgba(${o.c},${o.a})`);g.addColorStop(1,`rgba(${o.c},0)`);x.fillStyle=g;x.fillRect(0,0,w,h)});
  const P=items.map(it=>{it.y+=it.v/h;it.r+=it.vr;if(it.y>1.08){it.y=-.08;it.x=Math.random()}return [it.x*w+Math.sin(t*.0002+it.s)*12,it.y*h]});
  // links: device <-> AI sparkle
  items.forEach((a,i)=>{if(a.k!=="ai")return;items.forEach((b,j)=>{if(b.k==="ai")return;const dx=P[j][0]-P[i][0],dy=P[j][1]-P[i][1],d=Math.hypot(dx,dy);if(d>320)return;
    const al=(1-d/320)*.13;x.setLineDash([4,6]);const lg=x.createLinearGradient(P[i][0],P[i][1],P[j][0],P[j][1]);lg.addColorStop(0,`rgba(232,196,140,${al})`);lg.addColorStop(1,`rgba(236,150,160,${al*.8})`);x.strokeStyle=lg;x.lineWidth=1.1;x.shadowBlur=0;x.beginPath();x.moveTo(P[i][0],P[i][1]);x.lineTo(P[j][0],P[j][1]);x.stroke();x.setLineDash([]);
    x.shadowBlur=0;const f=((t*.00012+j*.13)%1);x.fillStyle=`rgba(246,205,189,${al*1.3})`;x.beginPath();x.arc(P[i][0]+dx*f,P[i][1]+dy*f,1.3,0,6.28);x.fill();x.shadowBlur=0})});
  items.forEach((it,i)=>{x.save();x.translate(P[i][0],P[i][1]);x.rotate(it.r);x.strokeStyle=`rgba(236,184,168,${it.a})`;x.shadowBlur=0;shape(it);x.restore()});
  if(!reduce)requestAnimationFrame(draw)}
 draw();})();


(function(){const box=document.getElementById("mk1");if(!box)return;const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ");
 const go=()=>{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const ns=box.querySelectorAll(".cnt");let t0=null;const f=ts=>{if(!t0)t0=ts;const p=Math.min((ts-t0)/3000,1),e=1-Math.pow(1-p,3);ns.forEach(x=>x.textContent=fmt(Math.round(+x.dataset.to*e/500)*500));if(p<1)requestAnimationFrame(f);else ns.forEach(x=>x.textContent=fmt(+x.dataset.to))};requestAnimationFrame(f)};
 let done=false;const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){if(done)return;done=true;box.querySelectorAll(".cnt").forEach(x=>x.textContent="0");setTimeout(go,180)}else if(!box.closest(".view.on")){done=false}}),{threshold:.4});o.observe(box)})();

(function(){const t=document.querySelector("#program .tree");if(!t||!("IntersectionObserver" in window))return;t.classList.add("anim");let tm=null;
 const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){if(t.classList.contains("go"))return;void t.offsetWidth;clearTimeout(tm);tm=setTimeout(()=>{void t.offsetWidth;t.classList.add("go");tm=setTimeout(()=>t.classList.add("floaty"),5200)},180)}else if(!t.closest(".view.on")){clearTimeout(tm);t.classList.remove("go","floaty")}}),{threshold:.12});o.observe(t)})();
</script>

<script>(function(){let tm=null,t2=null;
function fx(){const h=document.querySelector('[data-t="heroH"]');if(!h||h.dataset.fx===h.innerHTML)return;clearInterval(tm);clearTimeout(t2);
 let i=0;const wrap=n=>{if(n.nodeType===3){const parts=n.textContent.split(/(\s+)/);const f=document.createDocumentFragment();parts.forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(p));return}const sp=document.createElement('span');sp.className='hw';sp.style.setProperty('--d',(i++*0.14)+'s');sp.textContent=p;f.appendChild(sp)});n.replaceWith(f)}
  else if(n.classList&&n.classList.contains('hrot')){n.classList.add('hw');n.style.setProperty('--d',(i++*0.14)+'s')}else{[...n.childNodes].forEach(wrap)}};
 [...h.childNodes].forEach(wrap);h.classList.remove('go');void h.offsetWidth;
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 requestAnimationFrame(()=>h.classList.add('go'));

 const r=h.querySelector('.hrot');if(r&&!reduce){const W=r.dataset.w.split('|');let k=0;setTimeout(()=>{r.style.setProperty('--d','0s');tm=setInterval(()=>{r.classList.add('out');setTimeout(()=>{k=(k+1)%W.length;r.textContent=W[k];r.classList.remove('out')},550)},2300)},total+1800)}
 h.dataset.fx=h.innerHTML}
const run=()=>setTimeout(fx,60);run();
document.addEventListener('click',e=>{if(e.target.closest('[data-l],.lang button,.lang a'))setTimeout(fx,120)});
})();</script>
