<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тәтті Гайд</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: patisserie page whose ground changes colour per cake while scrolling; stacked feature cards; recipe opens as a sheet */
:root{
  --bg-home:#f8e9ec; --bg-cheese:#f9e3e8; --bg-choco:#efe0d6; --bg-honey:#f7ead0;
  --bg:var(--bg-home); --bg2:#f3dbe1; --surface:#fffaf8; --ink:#3b2420; --muted:#7d5f5a;
  --accent:#c2456a; --accent-ink:#fff; --gold:#b98a4e; --line:#ead0d6;
  --ok:#3f8a5c; --warn:#c0532f; --wa:#1f9d55; --cream:#fff6ef; --sponge:#d9a76a; --cocoa:#5a3125; --berry:#d23b5b;
  --c1:#f7c9d4;--c2:#d4e7c5;--c3:#f6e7a8;--c4:#ddd3f2;--c5:#f8cfb0;--c-ink:#3b2420;
  --display:"Noto Serif Display","Noto Serif","PT Serif","Times New Roman",serif;
  --body:"Golos Text","Noto Sans","Segoe UI",system-ui,sans-serif;
  --r:24px; --shadow:0 22px 44px -24px rgba(120,40,60,.5);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-home:#22140f; --bg-cheese:#2b151a; --bg-choco:#1c110c; --bg-honey:#28190c;
  --bg2:#2b1a15; --surface:#33211b; --ink:#f6e6e2; --muted:#c7aaa3;
  --accent:#f07c9d; --accent-ink:#2a0f17; --gold:#d9ad6f; --line:#4a3029;
  --ok:#7fcf9b; --warn:#f29a76; --wa:#3fcf7d; --c1:#5a2a37; --c2:#2f4a30; --c3:#55461b; --c4:#3d3358; --c5:#5e3622; --c-ink:#f6e6e2; --cream:#f4e4d8; --sponge:#c48f52; --cocoa:#7a4433; --berry:#f0607e; --shadow:0 22px 44px -24px rgba(0,0,0,.75); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg-home:#22140f; --bg-cheese:#2b151a; --bg-choco:#1c110c; --bg-honey:#28190c;
  --bg2:#2b1a15; --surface:#33211b; --ink:#f6e6e2; --muted:#c7aaa3;
  --accent:#f07c9d; --accent-ink:#2a0f17; --gold:#d9ad6f; --line:#4a3029;
  --ok:#7fcf9b; --warn:#f29a76; --wa:#3fcf7d; --c1:#5a2a37; --c2:#2f4a30; --c3:#55461b; --c4:#3d3358; --c5:#5e3622; --c-ink:#f6e6e2; --cream:#f4e4d8; --sponge:#c48f52; --cocoa:#7a4433; --berry:#f0607e; --shadow:0 22px 44px -24px rgba(0,0,0,.75); color-scheme:dark}
body[data-tint="cheese"]{--bg:var(--bg-cheese)}
body[data-tint="choco"]{--bg:var(--bg-choco)}
body[data-tint="honey"]{--bg:var(--bg-honey)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden;transition:background-color 1.1s ease}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:60}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;z-index:0;pointer-events:none;animation:drift 22s ease-in-out infinite alternate;transition:background 1.1s}
.blob.a{width:340px;height:340px;background:var(--bg2);top:-80px;left:-90px}
.blob.b{width:300px;height:300px;background:color-mix(in srgb,var(--accent) 22%,transparent);bottom:10%;right:-100px;animation-duration:28s}
body[data-tint="choco"] .blob.b{background:color-mix(in srgb,var(--cocoa) 35%,transparent)}
body[data-tint="honey"] .blob.b{background:color-mix(in srgb,var(--gold) 35%,transparent)}
@keyframes drift{to{transform:translate(60px,80px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-synthesis:none;font-weight:600;line-height:1.05;text-wrap:balance;margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* hero */
header.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:18px;position:relative;z-index:5}
.logo{font-family:var(--display);font-size:1.5rem;font-style:italic;font-weight:600}
.logo b{color:var(--accent);font-style:normal}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;position:relative}
.lang button{position:relative;z-index:1;border:0;background:none;color:var(--muted);font:700 .8rem var(--body);letter-spacing:.06em;padding:8px 14px;border-radius:999px;cursor:pointer;transition:color .3s}
.lang button[aria-pressed="true"]{color:var(--accent-ink)}
.lang .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--accent);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.lang[data-l="ru"] .knob{transform:translateX(100%)}
.hero{padding-block:28px 40px;display:grid;gap:22px}
.hero h1{font-size:clamp(2.5rem,10vw,5.2rem);font-weight:800;color:var(--accent);letter-spacing:-.02em;line-height:1.06;overflow-wrap:break-word}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block}
.play .ch{animation:chIn 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 55ms + .35s)}
@keyframes chIn{from{opacity:0;transform:translateY(.7em) scale(.3) rotate(-14deg);filter:blur(10px)}}
@keyframes emIn{from{opacity:0;transform:scale(.25) rotate(-8deg);filter:blur(14px)}}
@keyframes track{from{opacity:0;letter-spacing:.7em;filter:blur(4px)}}
@keyframes soft{from{opacity:0;transform:translateY(26px);filter:blur(10px)}}
@keyframes popIn{from{opacity:0;transform:scale(.2)}70%{transform:scale(1.06)}}
@keyframes down{from{opacity:0;transform:translateY(-40px)}}
@keyframes fadeIn{from{opacity:0}}
.boot header.top{animation:down 1.1s .1s cubic-bezier(.2,.8,.2,1) both}
.boot #bg{animation:fadeIn 3s .3s both}
.play.hero .eyebrow{animation:track 1.4s .15s cubic-bezier(.2,.8,.2,1) both}
.hero h1 em{display:inline-block;padding:0 .12em .08em 0;font-style:italic;font-weight:800;background:linear-gradient(100deg,var(--gold),var(--accent),var(--gold));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.play.hero h1 em{animation:emIn 1.3s 1.25s cubic-bezier(.2,.8,.2,1) both,shine 6s 2.6s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(.45em) rotate(2deg)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-220% 0}}
.hero p{max-width:34ch;color:var(--muted);font-size:1.06rem;margin:0}
.play.hero p{animation:soft 1.3s 1.9s cubic-bezier(.2,.8,.2,1) both}
.hero .row{display:flex;flex-wrap:wrap;gap:12px}
.play.hero .row .btn{animation:popIn .9s cubic-bezier(.2,.8,.2,1) both}.play.hero .row .btn:nth-child(1){animation-delay:2.3s}.play.hero .row .btn:nth-child(2){animation-delay:2.45s}
.btn{display:inline-flex;align-items:center;gap:9px;border:0;cursor:pointer;font:600 .95rem var(--body);padding:14px 22px;border-radius:999px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible,.card:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:var(--wa);color:#fff}
.stats{display:flex;gap:26px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.play.hero .stats>div{animation:soft 1.2s cubic-bezier(.2,.8,.2,1) both}.play.hero .stats>div:nth-child(1){animation-delay:2.6s}.play.hero .stats>div:nth-child(2){animation-delay:2.72s}.play.hero .stats>div:nth-child(3){animation-delay:2.84s}.play.hero .stats>div:nth-child(4){animation-delay:2.96s}
.stats b{display:block;font-family:var(--display);font-size:1.9rem;color:var(--ink);line-height:1}
.fadeswap{animation:swap .45s both}
@keyframes swap{from{opacity:0;transform:translateY(8px)}}

/* stacked feature cards */
section{padding-block:30px}
.sec-head{display:grid;gap:6px;margin-bottom:22px}
.sec-head h2{font-size:clamp(2rem,7vw,3rem)}
.list{display:grid;gap:60px}
.tiltwrap{perspective:1000px}
.card{width:100%;background:var(--surface);border-radius:var(--r);overflow:hidden;cursor:pointer;border:1px solid var(--line);text-align:left;padding:0;color:inherit;font:inherit;display:grid;grid-template-columns:1fr;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .4s;box-shadow:var(--shadow);position:relative;touch-action:pan-y}
.card.live{transition:transform .08s linear,box-shadow .4s}
@media(min-width:760px){.card{grid-template-columns:1.05fr 1fr}.tiltwrap:nth-child(even) .card .ph{order:2}}
.card .ph{aspect-ratio:4/3.6;overflow:hidden;max-width:100%}
@media(min-width:760px){.card .ph{aspect-ratio:auto;min-height:380px}}
.card img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04) translate(var(--px,0),var(--py,0));transition:transform .5s}
.card .tx{padding:22px 22px 24px;display:grid;gap:10px;align-content:center;transform:translateZ(30px)}
.card h3{font-size:clamp(2rem,6vw,2.6rem)}
.card .glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.35),transparent 55%);opacity:0;transition:opacity .4s;mix-blend-mode:soft-light}
.card.live .glare{opacity:1}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--ink)}
.card .go{font-weight:700;color:var(--accent);font-size:.95rem;display:flex;align-items:center;gap:6px}
.card .go span{transition:transform .3s}.card:hover .go span{transform:translateX(5px)}
.num-big{font-family:var(--display);font-style:italic;font-size:1rem;color:var(--muted)}

.float-tips{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 16px;padding-block:14px 26px}
.ft{flex:0 1 200px;min-width:0;max-width:calc(50% - 8px);transform:rotate(var(--rot));animation:bob var(--d) ease-in-out var(--dl) infinite alternate}
@media(min-width:760px){.ft{max-width:200px}}
.ft-in{background:var(--c);color:var(--c-ink);border-radius:20px;padding:16px 16px 18px;display:grid;gap:6px;box-shadow:0 16px 26px -18px rgba(60,20,30,.55);transition:transform .35s cubic-bezier(.3,1.5,.5,1);cursor:default;height:100%}
.ft:hover .ft-in,.ft:active .ft-in{transform:scale(1.07) rotate(calc(var(--rot) * -1))}
.ft-n{font-family:var(--display);font-style:italic;font-size:2.2rem;line-height:.9;opacity:.55}
.ft-t{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1.1}
.ft-p{font-size:.88rem;line-height:1.45}
@keyframes bob{from{transform:translateY(0) rotate(var(--rot))}to{transform:translateY(-14px) rotate(calc(var(--rot) * -1))}}
.basics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.basic{padding:18px;border-radius:16px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px dashed var(--line)}
.basic b{font-family:var(--display);font-size:1.35rem;display:block}
.basic span{color:var(--muted);font-size:.9rem}

.cta{background:var(--ink);color:var(--bg);border-radius:28px;padding:32px 24px;display:grid;gap:14px;position:relative;overflow:hidden}
.cta h2{font-size:clamp(2rem,7vw,2.8rem);color:var(--bg)}
.cta p{margin:0;opacity:.8;max-width:42ch}
.cta .num{font-variant-numeric:tabular-nums;user-select:all;font-weight:700;letter-spacing:.04em}
.cta .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cta .copy{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
.cta::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-60px;top:-70px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 60%,transparent),transparent 70%);animation:drift 9s ease-in-out infinite alternate}
footer{padding-block:30px 100px;text-align:center;color:var(--muted);font-size:.85rem}

.fab{position:fixed;z-index:20;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.4);animation:pulse 2.6s infinite}
.fab svg{width:30px;height:30px;fill:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--wa) 55%,transparent)}70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:end center}
.sheet .veil{position:absolute;inset:0;background:rgba(40,15,20,.45);backdrop-filter:blur(4px);animation:fade .35s both}
.panel{position:relative;width:min(760px,100%);max-height:94%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:28px 28px 0 0;animation:up .55s cubic-bezier(.2,.8,.2,1) both;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
@media(min-width:800px){.sheet{place-items:center}.panel{border-radius:28px;max-height:90%}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.panel .cover{position:relative;height:250px;overflow:hidden}
.panel .cover img{width:100%;height:100%;object-fit:cover;animation:zoom 8s ease-out both}
@keyframes zoom{from{transform:scale(1.18)}}
.panel .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--bg))}
.close{position:absolute;top:14px;right:14px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:1.4rem;cursor:pointer;box-shadow:var(--shadow)}
.pin{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:26px;margin-top:-40px;position:relative}
.pin h2{font-size:clamp(2.3rem,9vw,3.4rem)}
.st{animation:rise .7s both}
.block h4{font-family:var(--display);font-size:1.6rem;font-weight:600;margin:0 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.block h4 small{font-family:var(--body);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.serv{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
.serv button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.1rem;cursor:pointer}
.serv b{color:var(--ink);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.ing{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ing li{display:flex;gap:12px;align-items:baseline;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer;transition:opacity .3s}
.ing li .q{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ing li .box{width:18px;height:18px;flex:none;border-radius:6px;border:2px solid var(--accent);transform:translateY(3px);display:grid;place-items:center;transition:background .2s,transform .3s}
.ing li.done{opacity:.45}.ing li.done .nm{text-decoration:line-through}
.ing li.done .box{background:var(--accent);transform:translateY(3px) scale(1.15)}
.ing li.done .box::after{content:"✓";color:var(--accent-ink);font-size:.7rem;font-weight:800}
.ing .grp{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 4px 4px;border:0;cursor:default}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:42px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;font-weight:700;color:var(--accent)}
.steps li p{margin:8px 0 0}
.steps .t{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:700;color:var(--gold)}
.tips{display:grid;gap:10px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.tip i{font-style:normal;font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1;color:var(--ok);min-width:1.1em}
.tip.bad i{color:var(--warn)}
.tip p{margin:0}.tip b{display:block}
.tip.bad{border-left:4px solid var(--warn)}
.secret{border:0;width:100%;text-align:left;cursor:pointer;font:inherit;color:var(--accent-ink);background:linear-gradient(130deg,var(--accent),var(--gold));border-radius:20px;padding:22px;display:grid;gap:8px;position:relative;overflow:hidden}
.secret .lbl{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.1}
.secret .hint{font-size:.85rem;opacity:.85}
.secret .body{max-height:0;overflow:hidden;transition:max-height .6s ease,opacity .6s;opacity:0}
.secret.open .body{max-height:300px;opacity:1}
.secret::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:250% 100%;animation:shine 3.5s linear infinite}
.wa-line{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* scroll reveal, scrubbed by scroll position (--p: 0 → 1) */
[data-rv]{--q:calc(1 - var(--p,1))}
[data-rv="up"]{opacity:var(--p,1);translate:0 calc(var(--q) * 44px);filter:blur(calc(var(--q) * 7px))}
.wd{display:inline-block;white-space:pre}
[data-rv="pop"]{opacity:min(1,calc(var(--p,1) * 1.6));scale:var(--p,1);rotate:calc(var(--q) * -28deg)}
[data-rv="card"]{opacity:min(1,calc(var(--p,1) * 1.4));scale:calc(.55 + .45 * var(--p,1));translate:0 calc(var(--q) * 110px);rotate:calc(var(--q) * -5deg)}
[data-rv="card"] .ph img{clip-path:circle(calc(15% + var(--p,1) * 72%) at 50% 50%);opacity:var(--p,1);scale:calc(1 + var(--q) * .3);filter:blur(calc(var(--q) * 16px))}
[data-rv="card"] .tx>*{opacity:var(--p,1);translate:calc(var(--q) * 40px) 0}
[data-rv="card"] .tx>:nth-child(2){translate:calc(var(--q) * 70px) 0}
[data-rv="card"] .tx>:nth-child(n+3){translate:calc(var(--q) * 100px) 0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="blob a"></div><div class="blob b"></div>


<div class="wrap" id="app">
  <header class="top">
    <div class="logo">Тәтті<b>·</b>Гайд</div>
    <div class="lang" id="lang" data-l="kk" role="group" aria-label="Тіл / Язык"><span class="knob"></span><button type="button" data-l="kk" aria-pressed="true">ҚАЗ</button><button type="button" data-l="ru" aria-pressed="false">РУС</button></div>
  </header>

  <div class="hero" id="hero"></div>

  <section id="recipes">
    <div class="sec-head"><div class="eyebrow" data-rv="up" data-i="recEy"></div><h2 data-i="recH"></h2></div>
    <div class="list" id="cards"></div>
  </section>

  <section data-tint-zone="home">
    <div class="sec-head"><div class="eyebrow" data-rv="up" data-i="ftEy"></div><h2 data-i="ftH"></h2></div>
    <div class="float-tips" id="ftips"></div>

 $("#basics").innerHTML=t.basics.map((b,i)=>`<div class="basic" data-rv="pop" data-d="${(i*.12).toFixed(2)}"><b>${b[0]}</b><span>${b[1]}</span></div>`).join("");
 $$(".sec-head h2").forEach(h=>{h.innerHTML=h.textContent.split(" ").map((w,i,a)=>`<span class="wd" data-rv="up" data-d="${(i*.14).toFixed(2)}">${w}${i<a.length-1?" ":""}</span>`).join("")});
 refreshRv();
 const url="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(t.waText);
 $$("[data-wa]").forEach(a=>{a.href=url;a.target="_blank";a.rel="noopener"});
 const lg=$("#lang");lg.dataset.l=L;lg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
}
$("#lang").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.l===L)return;L=b.dataset.l;try{localStorage.setItem("tg-lang",L)}catch(e){}
 renderAll(false);$$("#app section, #hero, footer").forEach(el=>{el.classList.remove("fadeswap");void el.offsetWidth;el.classList.add("fadeswap")});
 if(!$("#sheet").hidden&&cur)open(cur.id,true)};
$("#num").textContent="+"+WA_NUMBER.replace(/^(\d)(\d{3})(\d{3})(\d{2})(\d{2})$/,"$1 $2 $3 $4 $5");
$("#copy").onclick=e=>{const b=e.currentTarget;const p=navigator.clipboard?.writeText("+"+WA_NUMBER);const sel=()=>{const r=document.createRange();r.selectNodeContents($("#num"));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent=T().selected};

/* scroll reveal engine: target from scroll position, displayed value eases toward it slowly */
let RV=[],rvFirst=true,rvRun=false;const rvOn=!matchMedia("(prefers-reduced-motion: reduce)").matches;
function rvTarget(o,vh){const top=o.el.getBoundingClientRect().top;let raw=(vh*1.02-top)/(vh*.6);raw=Math.min(1,Math.max(0,raw));
 let p=o.d?Math.min(1,Math.max(0,(raw-o.d)/(1-o.d))):raw;return 1-Math.pow(1-p,3)}
function refreshRv(){const vh=innerHeight;RV=[...$$("[data-rv]")].map(el=>{const o={el,d:+(el.dataset.d||0)};o.cur=rvFirst||!rvOn?0:rvTarget(o,vh);if(!rvOn)o.cur=1;el.style.setProperty("--p",o.cur);return o});rvFirst=false;kickRv()}
function kickRv(){if(rvOn&&!rvRun){rvRun=true;requestAnimationFrame(loopRv)}}
function loopRv(){const vh=innerHeight;let busy=false;
 for(const o of RV){const tg=rvTarget(o,vh),df=tg-o.cur;if(Math.abs(df)>.0015){o.cur+=df*.035;busy=true}else o.cur=tg;
  const v=Math.round(o.cur*1000)/1000;if(v!==o.last){o.last=v;o.el.style.setProperty("--p",v)}}
 if(busy)requestAnimationFrame(loopRv);else rvRun=false}
addEventListener("scroll",kickRv,{passive:true});addEventListener("resize",kickRv);

/* tilt cards */
const fine=matchMedia("(prefers-reduced-motion: reduce)").matches===false;
function bindTilt(){if(!fine)return;$$(".card").forEach(c=>{
 const move=e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
  c.classList.add("live");c.style.transform=`rotateY(${px*14}deg) rotateX(${-py*12}deg) scale(1.02)`;
  c.style.setProperty("--gx",(px+.5)*100+"%");c.style.setProperty("--gy",(py+.5)*100+"%");
  c.style.setProperty("--px",(-px*14)+"px");c.style.setProperty("--py",(-py*14)+"px")};
 const reset=()=>{c.classList.remove("live");c.style.transform="";c.style.setProperty("--px","0");c.style.setProperty("--py","0")};
 c.addEventListener("pointermove",move);c.addEventListener("pointerdown",move);
 c.addEventListener("pointerleave",reset);c.addEventListener("pointerup",()=>{if(c.matches(":hover")&&matchMedia("(hover:hover)").matches)return;setTimeout(reset,250)});c.addEventListener("pointercancel",reset)})}

/* scroll tint */
let io;function observeTint(){io?.disconnect();const vis=new Map();
 io=new IntersectionObserver(es=>{es.forEach(e=>vis.set(e.target,e.intersectionRatio));let best="home",m=.25;vis.forEach((v,el)=>{if(v>m){m=v;best=el.dataset.tintZone}});document.body.dataset.tint=best},{threshold:[0,.25,.5,.75,1],rootMargin:"-20% 0px -20% 0px"});
 $$("[data-tint-zone]").forEach(z=>io.observe(z))}

/* confetti */
const fx=$("#fx"),fc=fx.getContext("2d");let bits=[],fxOn=false;
function sizeFx(){const d=Math.min(devicePixelRatio||1,2);fx.width=innerWidth*d;fx.height=innerHeight*d;fc.setTransform(d,0,0,d,0,0)}
sizeFx();addEventListener("resize",sizeFx);
function confetti(x,y,n=90){if(!fine)return;const s=getComputedStyle(document.documentElement),cols=["--accent","--gold","--berry","--ok","--cream"].map(v=>s.getPropertyValue(v).trim());
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*8;bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:4+Math.random()*5,h:8+Math.random()*8,c:cols[i%cols.length],life:1,round:Math.random()<.3})}
 if(!fxOn){fxOn=true;requestAnimationFrame(tick)}}
function tick(){fc.clearRect(0,0,innerWidth,innerHeight);bits=bits.filter(b=>b.life>0);
 for(const b of bits){b.vy+=.28;b.vx*=.985;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;b.life-=.009;fc.save();fc.globalAlpha=Math.max(0,b.life);fc.translate(b.x,b.y);fc.rotate(b.r);fc.fillStyle=b.c;
  if(b.round){fc.beginPath();fc.arc(0,0,b.w*.6,0,6.28);fc.fill()}else fc.fillRect(-b.w/2,-b.h/2,b.w,b.h*Math.abs(Math.cos(b.r*2)));fc.restore()}
 if(bits.length)requestAnimationFrame(tick);else{fxOn=false;fc.clearRect(0,0,innerWidth,innerHeight)}}
function crumbs(){const r=$("#cake").getBoundingClientRect();for(let i=0;i<38;i++)bits.push({x:r.left+r.width*(.15+Math.random()*.75),y:r.top+r.height*(.15+Math.random()*.35),vx:(Math.random()-.5)*4,vy:-1-Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:2+Math.random()*3,h:2+Math.random()*3,c:["#c98a45","#b87536","#dcae6a"][i%3],life:.9,round:true});if(!fxOn){fxOn=true;requestAnimationFrame(tick)}}
const burstAt=el=>{const r=el.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2)};

/* recipe sheet */
let cur,serv,last;
function ingHTML(){return cur.ing.map((x,i)=>x.length===1?`<li class="grp">${x[0]}</li>`:`<li data-k="${i}"><span class="box"></span><span class="nm">${x[0]}</span><span class="q">${fmt(x[1]*serv/cur.serv)} ${x[2]}</span></li>`).join("")}
function updProg(){const all=$$("#ing li[data-k]"),d=$$("#ing li.done");$("#prog").style.width=(d.length/all.length*100)+"%";return [d.length,all.length]}
function open(id,keep){
 const t=T();const prevServ=serv;cur=R[L].find(r=>r.id===id);serv=keep?prevServ:cur.serv;if(!keep)last=document.activeElement;
 let d=0;const st=()=>`class="st" style="animation-delay:${(d+=.08).toFixed(2)}s"`;
 $("#panel").innerHTML=`<button class="close" data-close aria-label="${t.close}">×</button>
 <div class="cover"><img src="${IMG[cur.id]}" alt=""></div>
 <div class="pin">
  <div ${st()}><div class="eyebrow">${cur.tag} · ${cur.time} · ${cur.level}</div><h2 id="rt" style="margin-top:6px">${cur.name}</h2><p style="color:var(--muted);margin:8px 0 0">${cur.desc}</p></div>
  <div class="block" ${st()}><h4>${t.ing} <small>${t.ingS}</small></h4>
   <div class="serv">${t.serv}: <button type="button" data-s="-1" aria-label="−">−</button><b id="sv">${serv}</b><button type="button" data-s="1" aria-label="+">+</button></div>
   <div class="prog"><i id="prog"></i></div>
   <ul class="ing" id="ing">${ingHTML()}</ul></div>
  <div class="block" ${st()}><h4>${t.how}</h4><ol class="steps">${cur.steps.map(s=>`<li><div><p>${s[0]}</p>${s[1]?`<span class="t">${s[1]}</span>`:""}</div></li>`).join("")}</ol></div>
  <div class="block" ${st()}><h4>${t.tips} <small>${t.tipsS}</small></h4><div class="tips">${cur.tips.map((x,i)=>`<div class="tip st" style="animation-delay:${(.5+i*.07).toFixed(2)}s"><i>${i+1}</i><p>${x}</p></div>`).join("")}</div></div>
  <div class="block" ${st()}><h4>${t.bad} <small>${t.badS}</small></h4><div class="tips">${cur.bad.map(x=>`<div class="tip bad"><i>✕</i><p><b>${x[0]}</b>${x[1]}</p></div>`).join("")}</div></div>
  <div class="block" ${st()}><h4>${t.sec}</h4>
   <button class="secret" type="button" id="sec" aria-expanded="false"><span class="lbl">${t.secBtn}</span><span class="hint">${t.secHint}</span><span class="body">${cur.secret}</span></button></div>
  <div class="wa-line" ${st()}><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t.waRec(cur.name))}">${t.ask}</a><button class="btn ghost" type="button" data-close>${t.close}</button></div>
 </div>`;
 $("#sheet").hidden=false;document.body.style.overflow="hidden";if(!keep){$("#panel").scrollTop=0;$(".close").focus()}
}
function close(){$("#sheet").hidden=true;document.body.style.overflow="";last?.focus()}
$("#cards").onclick=e=>{const c=e.target.closest(".card");if(c)open(c.dataset.id)};
$("#sheet").onclick=e=>{
 if(e.target.closest("[data-close]"))return close();
 const s=e.target.closest("[data-s]");if(s){serv=Math.max(1,Math.min(40,serv+ +s.dataset.s));$("#sv").textContent=serv;const done=[...$$("#ing li.done")].map(l=>l.dataset.k);$("#ing").innerHTML=ingHTML();done.forEach(k=>$(`#ing li[data-k="${k}"]`)?.classList.add("done"));updProg();return}
 const li=e.target.closest(".ing li[data-k]");if(li){li.classList.toggle("done");const [a,b]=updProg();if(a===b&&li.classList.contains("done")){burstAt(li);const p=li.parentElement.previousElementSibling;}return}
 const sec=e.target.closest("#sec");if(sec){const o=sec.classList.toggle("open");sec.setAttribute("aria-expanded",o);sec.querySelector(".lbl").textContent=o?T().secOpen:T().secBtn;sec.querySelector(".hint").hidden=o;if(o)burstAt(sec)}
};

/* ambient background */
(()=>{const c=$("#bg"),x=c.getContext("2d");let W,H,P=[],dpr=Math.min(devicePixelRatio||1,2);
 const col=()=>{const s=getComputedStyle(document.documentElement);return["--accent","--gold","--muted"].map(v=>s.getPropertyValue(v).trim())};
 let C=col();matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>C=col());
 function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.round(Math.min(46,W*H/22000));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,t:Math.floor(Math.random()*3),s:4+Math.random()*9,r:Math.random()*6.28,vr:(Math.random()-.5)*.01,vy:.12+Math.random()*.3,ph:Math.random()*6.28,c:Math.floor(Math.random()*3),a:.10+Math.random()*.14}))}
 function heart(s){x.beginPath();x.moveTo(0,s*.35);x.bezierCurveTo(-s,-s*.3,-s*.45,-s,0,-s*.45);x.bezierCurveTo(s*.45,-s,s,-s*.3,0,s*.35);x.fill()}
 function draw(tm){x.clearRect(0,0,W,H);
  for(const p of P){p.y-=p.vy;p.r+=p.vr;const dx=Math.sin(tm/2400+p.ph)*14;if(p.y<-20){p.y=H+20;p.x=Math.random()*W}
   x.save();x.translate(p.x+dx,p.y);x.rotate(p.r);x.globalAlpha=p.a;x.fillStyle=C[p.c];
   if(p.t===0){x.beginPath();x.roundRect?x.roundRect(-p.s*.6,-1.6,p.s*1.2,3.2,2):x.rect(-p.s*.6,-1.6,p.s*1.2,3.2);x.fill()}
   else if(p.t===1){const s=p.s*1.3;x.beginPath();x.ellipse(0,-s*.28,s,s*.42,0,0,6.28);x.fill();x.beginPath();x.ellipse(0,s*.28,s,s*.42,0,0,6.28);x.fill();x.globalAlpha=p.a*.6;x.fillRect(-s*.9,-s*.08,s*1.8,s*.16)}
   else heart(p.s);x.restore()}
  if(fine)requestAnimationFrame(draw)}
 addEventListener("resize",size);size();requestAnimationFrame(draw)})();
</script>
