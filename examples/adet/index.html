<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Әдет</title>
<meta name="claude:viewport-fit-sides" content="cover">

<meta name="theme-color" content="#0E2A21">

<style>
/* Layout: one phone-width column. Tree on top, week strip, habit cards; bottom tab bar switches to the stats screen. */
:root{
  --bg:#0E2A21; --bg2:#13352A; --card:#1A4335; --card2:#21503F; --line:#2F6450;
  --caramel:#E3BC6E; --copper:#C9925A; --ink:#F4F1E4; --muted:#B9CFC2; --dim:#86A797;
  --leaf:#A3D47E; --leaf2:#B9E296; --leaf3:#6DBA5C;
  --display:'Lora',Georgia,serif; --ui:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px}
body{min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(700px 420px at 50% -80px,#1F5A45 0%,transparent 70%),var(--bg);overflow-x:hidden}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:18px 24px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.r1{animation-delay:.08s}.r2{animation-delay:.16s}.r3{animation-delay:.24s}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hello{margin:0;font-family:var(--display);font-weight:600;font-size:28px;color:var(--ink)}
.date{margin:4px 0 0;color:var(--muted);font-size:15px}
.orn{width:44px;height:44px;flex:none;opacity:.8}

/* tree */
.treeCard{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:28px;padding:18px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;overflow:hidden}
#tree{width:100%;max-width:300px;height:auto;display:block}
.leafEl{transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .4s}
.leafEl.off{transform:scale(0);opacity:0}
.flower{transform-box:fill-box;transform-origin:center;transition:transform .6s cubic-bezier(.3,1.6,.5,1) .2s}
.flower.off{transform:scale(0)}
.count{font-family:var(--display);font-size:30px;font-weight:600;color:var(--ink);line-height:1}
.count small{font-family:var(--ui);font-size:15px;font-weight:600;color:var(--muted)}
.phrase{margin:0;color:var(--caramel);font-weight:700;font-size:15px;text-align:center}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:none;background:transparent;border-radius:16px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-height:64px}
.day .dn{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.04em}
.day .dd{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--bg2);border:1.5px solid var(--line);position:relative}
.day .dd svg{position:absolute;inset:-3px;width:40px;height:40px;transform:rotate(-90deg)}
.day.sel{background:var(--card)}
.day.sel .dn{color:var(--caramel)}
.day.full .dd{background:var(--leaf3);border-color:var(--leaf3);color:#0E2A21}
.day.future{opacity:.35;cursor:default}
.sectionHead{display:flex;justify-content:space-between;align-items:baseline}
.sectionHead h2{margin:0;font-family:var(--display);font-weight:600;font-size:21px}
.sectionHead span{color:var(--muted);font-size:14px}

/* habits */
.list{display:flex;flex-direction:column;gap:10px}
.habit{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px 12px 12px;transition:background .3s,border-color .3s}
.habit.done{background:var(--card2);border-color:var(--hc)}
.check{flex:none;width:48px;height:48px;border-radius:50%;border:2.5px solid var(--hc);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s}
.check svg{width:24px;height:24px;stroke:#0E2A21;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .35s ease .05s}
.habit.done .check{background:var(--hc)}
.habit.done .check svg{stroke-dashoffset:0}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.check.pop{animation:pop .35s ease}
.hbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;background:none;border:none;padding:4px 0;cursor:pointer}
.hname{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.habit.done .hname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
.streak{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.streak svg{width:14px;height:14px}
.add{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border:1.5px dashed var(--line);border-radius:20px;background:transparent;color:var(--caramel);font-weight:800;font-size:16px;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:12px;margin:0}

/* install hint */
.hint{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--muted)}
.hint b{color:var(--ink)}
.hint button{margin-left:auto;background:none;border:none;color:var(--dim);font-size:22px;line-height:1;cursor:pointer;min-width:32px;min-height:32px}

/* stats */
.monthNav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthNav h2{margin:0;font-family:var(--display);font-weight:600;font-size:22px;text-transform:capitalize}
.navBtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center}
.navBtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:12px;font-weight:700;color:var(--dim);text-align:center;padding-bottom:4px}
.cell{aspect-ratio:1;max-width:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--bg2);color:var(--dim)}
.cell.l1{background:#2E5E44;color:var(--ink)}
.cell.l2{background:#4F8F53;color:#fff}
.cell.l3{background:var(--leaf);color:#0E2A21}
.cell.today{outline:2px solid var(--caramel);outline-offset:-2px}
.legend{display:flex;gap:10px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--display);font-size:30px;font-weight:600;color:var(--caramel);line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.hstat{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.hstat .dot{width:14px;height:14px;border-radius:50%;flex:none}
.hstat .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.hstat .nums{display:flex;gap:14px;font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.hstat .nums b{display:block;color:var(--ink);font-size:16px}
.bar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,42,33,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;gap:8px}
.tab{flex:1;max-width:200px;min-height:56px;border:none;background:transparent;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true]{color:var(--caramel);background:var(--bg2)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(4,14,10,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg2);border-top:1px solid var(--line);border-radius:26px 26px 0 0;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transform:translateY(105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;max-width:560px;margin:0 auto}
.sheet.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet h3{margin:0 0 16px;font-family:var(--display);font-weight:600;font-size:22px}
.sheet label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.sheet input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;min-height:50px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.sugg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;cursor:pointer;min-height:38px}
.colors{display:flex;gap:12px;margin:18px 0 22px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.sw[aria-pressed=true]{border-color:var(--ink)}
.row{display:flex;gap:10px}
.btn{flex:1;min-height:52px;border-radius:999px;border:none;font-weight:800;font-size:16px;cursor:pointer}
.btn.main{background:linear-gradient(180deg,var(--caramel),var(--copper));color:#0E2A21}
.btn.del{flex:none;padding:0 20px;background:transparent;border:1px solid #8A4A3A;color:#F0A894}
.confirm{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding:14px;border:1px solid #8A4A3A;border-radius:16px;font-size:14px;color:var(--muted)}

/* confetti */
.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<!-- TODAY SCREEN -->
<main class="wrap" id="screenToday">
  <header class="top rise">
    <div>
      <h1 class="hello" id="hello">Қайырлы күн!</h1>
      <p class="date" id="dateLine"></p>
    </div>
    <svg class="orn" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#C07A4A" stroke-width="2" stroke-linecap="round">
      <path d="M24 40V22"/><path d="M24 22c0-6-4-9-9-9 0 5 3 9 9 9z"/><path d="M24 22c0-6 4-9 9-9 0 5-3 9-9 9z"/>

    </svg>

  <div class="hint" id="installHint" hidden>

  <section class="treeCard rise r1" aria-label="Бүгінгі прогресс">

      <g stroke="#8A5A3A" stroke-linecap="round" fill="none">
        <path d="M130 195 C128 170 133 150 130 120" stroke-width="12"/>
        <path d="M130 140 C112 128 98 116 84 98" stroke-width="7"/>
        <path d="M131 132 C150 120 164 108 178 92" stroke-width="7"/>

  <section class="rise r3" style="display:flex;flex-direction:column;gap:12px">

    <button class="add" id="addBtn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Жаңа әдет
    </button>
  </section>
</main>

<!-- STATS SCREEN -->
<main class="wrap" id="screenStats" hidden>
  <header class="top">
    <div><h1 class="hello">Статистика</h1><p class="date">Әдеттеріңіздің айлық көрінісі</p></div>
  </header>
  <div class="monthNav">
    <button class="navBtn" id="prevM" type="button" aria-label="Алдыңғы ай"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="monthTitle"></h2>
    <button class="navBtn" id="nextM" type="button" aria-label="Келесі ай"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="cal" id="cal"></div>
  <div class="legend"><span>Аз</span><i style="background:#13352A"></i><i style="background:#2E5E44"></i><i style="background:#4F8F53"></i><i style="background:#A3D47E"></i><span>Толық</span></div>
  <div class="tiles">
    <div class="tile"><b id="tFull">0</b><span>толық орындалған күн</span></div>
    <div class="tile"><b id="tPct">0%</b><span>айдағы орындалу</span></div>
  </div>

  <div class="list" id="hstats"></div>

<nav class="tabs" role="tablist" aria-label="Бөлімдер">
  <button class="tab" role="tab" aria-selected="true" id="tabToday" type="button">

  </button>
  <button class="tab" role="tab" aria-selected="false" id="tabStats" type="button">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Статистика
  </button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <h3 id="sheetTitle">Жаңа әдет</h3>
  <form id="hform">
    <label for="hname">Атауы</label>
    <input id="hname" maxlength="40" placeholder="Мысалы: 10 бет кітап оқу" autocomplete="off" required>
    <div class="sugg" id="sugg"></div>
    <div class="colors" id="colors"></div>
    <div class="row">
      <button class="btn del" type="button" id="delBtn" hidden>Өшіру</button>
      <button class="btn main" type="submit" id="saveBtn">Сақтау</button>
    </div>
    <div class="confirm" id="confirm" hidden>
      Бұл әдет пен оның барлық белгілері өшеді.
      <div class="row"><button class="btn del" type="button" id="noDel" style="flex:1">Жоқ</button><button class="btn main" type="button" id="yesDel">Иә, өшіру</button></div>
    </div>
  </form>
</div>

<script>
(function(){
  var COLORS=['#9FDDB0','#E3BC6E','#E8876B','#7DB8DA','#CDA6E0','#F0D27A'];
  var SUGG=['Су ішу','10 бет кітап оқу','Серуендеу','Ерте тұру','Спорт','Телефонсыз 1 сағат','Ағылшын тілі','Дұға / медитация'];
  var MONTHS=['қаңтар','ақпан','наурыз','сәуір','мамыр','маусым','шілде','тамыз','қыркүйек','қазан','қараша','желтоқсан'];
  var DAYS_FULL=['жексенбі','дүйсенбі','сейсенбі','сәрсенбі','бейсенбі','жұма','сенбі'];
  var DAYS_SHORT=['Дс','Сс','Ср','Бс','Жм','Сб','Жс'];
  var KEY='adet-v1';
  var $=function(id){return document.getElementById(id)};

  function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
  function today(){var d=new Date();d.setHours(0,0,0,0);return d}
  function uid(){return Math.random().toString(36).slice(2,9)}

  // ---- storage ----
  var state;
  function load(){
    try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){state=null}
    if(!state||!state.habits){
      var t=key(today());
      state={habits:[
        {id:uid(),name:'Су ішу · 8 стақан',color:COLORS[3]},
        {id:uid(),name:'10 бет кітап оқу',color:COLORS[1]},
        {id:uid(),name:'Серуендеу',color:COLORS[0]},
        {id:uid(),name:'Ерте тұру',color:COLORS[5]}
      ],log:{},hint:true};
    }
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  function doneOn(k){return (state.log[k]||[]).filter(function(id){return state.habits.some(function(h){return h.id===id})})}
  function isDone(id,k){return (state.log[k]||[]).indexOf(id)>-1}
  function ratio(k){var n=state.habits.length;return n?doneOn(k).length/n:0}

  function streak(id){
    var d=today(),n=0;
    if(!isDone(id,key(d)))d=addDays(d,-1);
    while(isDone(id,key(d))){n++;d=addDays(d,-1)}
    return n;
  }
  function best(id){
    var ks=Object.keys(state.log).filter(function(k){return isDone(id,k)}).sort(),b=0,run=0,prev=null;
    ks.forEach(function(k){var d=new Date(k+'T00:00:00');run=(prev&&key(addDays(prev,1))===k)?run+1:1;if(run>b)b=run;prev=d});
    return b;
  }

  var sel=today();

  // ---- tree ----
  // leaves grow in clusters at the branch tips; slots are interleaved so every branch fills evenly
  var TIPS=[[84,96],[178,90],[130,60],[104,58],[156,52],[66,118],[194,116],[116,104],[146,100]];
  var JIT=[[0,0],[-12,-8],[12,-6],[-8,10],[10,9],[0,-15],[-15,2],[15,1]];
  var LEAF_COLORS=['#8FD17A','#B5E08F','#6DBA5C','#A3D986'];
  var FLOWERS=[[90,88],[172,82],[130,50],[110,50],[150,44],[72,110],[188,108]];
  (function buildTree(){
    var g=$('leaves'),ns='http://www.w3.org/2000/svg',n=0;
    for(var ring=0;ring<JIT.length;ring++){
      for(var t=0;t<TIPS.length;t++){
        if(ring>=5&&t>=7)continue;
        var x=TIPS[t][0]+JIT[ring][0]*(t%2?1:-1),y=TIPS[t][1]+JIT[ring][1];
        var wrap=document.createElementNS(ns,'g');wrap.setAttribute('class','leafEl off');
        wrap.style.transitionDelay=(n*0.02)+'s';
        var e=document.createElementNS(ns,'ellipse');
        e.setAttribute('cx',x);e.setAttribute('cy',y);e.setAttribute('rx',11);e.setAttribute('ry',7.5);
        e.setAttribute('fill',LEAF_COLORS[(t+ring)%4]);
        e.setAttribute('transform','rotate('+(((t*53+ring*31)%90)-45)+' '+x+' '+y+')');
        wrap.appendChild(e);g.appendChild(wrap);n++;
      }
    }
    var f=$('flowers');
    FLOWERS.forEach(function(p){
      var c=document.createElementNS(ns,'g');c.setAttribute('class','flower off');
      for(var a=0;a<5;a++){var pe=document.createElementNS(ns,'circle');var ang=a*72*Math.PI/180;
        pe.setAttribute('cx',p[0]+Math.cos(ang)*4.5);pe.setAttribute('cy',p[1]+Math.sin(ang)*4.5);pe.setAttribute('r',3.6);pe.setAttribute('fill','#F6D9A8');c.appendChild(pe)}
      var mid=document.createElementNS(ns,'circle');mid.setAttribute('cx',p[0]);mid.setAttribute('cy',p[1]);mid.setAttribute('r',2.6);mid.setAttribute('fill','#C07A4A');c.appendChild(mid);
      f.appendChild(c);
    });
  })();

  function drawTree(r){
    var leaves=document.querySelectorAll('.leafEl'),show=Math.round(r*leaves.length);
    leaves.forEach(function(l,i){l.classList.toggle('off',i>=show)});
    document.querySelectorAll('.flower').forEach(function(f){f.classList.toggle('off',r<1)});
  }

  // ---- render today ----
  function greet(){
    var h=new Date().getHours();
    $('hello').textContent=h>=5&&h<11?'Қайырлы таң!':h>=11&&h<17?'Қайырлы күн!':h>=17&&h<23?'Қайырлы кеш!':'Қайырлы түн!';
    var d=new Date();$('dateLine').textContent=d.getDate()+' '+MONTHS[d.getMonth()]+', '+DAYS_FULL[d.getDay()];
  }

  function renderWeek(){
    var t=today(),wd=(t.getDay()+6)%7,mon=addDays(t,-wd),box=$('week');box.innerHTML='';
    for(var i=0;i<7;i++){
      var d=addDays(mon,i),k=key(d),r=ratio(k),fut=d>t;
      var b=document.createElement('button');b.type='button';
      b.className='day'+(key(d)===key(sel)?' sel':'')+(r===1&&state.habits.length?' full':'')+(fut?' future':'');
      b.setAttribute('aria-label',d.getDate()+' '+MONTHS[d.getMonth()]+(fut?'':', '+Math.round(r*100)+'%'));
      if(fut)b.disabled=true;
      var C=2*Math.PI*18,ring=(r>0&&r<1)?'<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#A3D47E" stroke-width="3" stroke-dasharray="'+(C*r)+' '+C+'" stroke-linecap="round"/></svg>':'';
      b.innerHTML='<span class="dn">'+DAYS_SHORT[i]+'</span><span class="dd">'+ring+'<span>'+d.getDate()+'</span></span>';
      (function(dd){b.addEventListener('click',function(){sel=dd;renderToday()})})(d);
      box.appendChild(b);
    }
  }

  var FLAME='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z" fill="#D9A066"/></svg>';

  function renderList(){
    var k=key(sel),box=$('list');box.innerHTML='';
    var isToday=k===key(today());
    $('listTitle').textContent=isToday?'Бүгінгі әдеттер':sel.getDate()+' '+MONTHS[sel.getMonth()];
    if(!state.habits.length){box.innerHTML='<p class="empty">Әзірге әдет жоқ. Төмендегі батырма арқылы біріншісін қосыңыз.</p>';return}
    state.habits.forEach(function(h){
      var done=isDone(h.id,k),s=streak(h.id);
      var row=document.createElement('div');row.className='habit'+(done?' done':'');row.style.setProperty('--hc',h.color);
      var chk=document.createElement('button');chk.type='button';chk.className='check';
      chk.setAttribute('aria-pressed',done?'true':'false');chk.setAttribute('aria-label',h.name+(done?' — орындалды':' — белгілеу'));
      chk.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      chk.addEventListener('click',function(){toggle(h.id,k,chk)});
      var body=document.createElement('button');body.type='button';body.className='hbody';body.setAttribute('aria-label',h.name+' — өзгерту');
      var nm=document.createElement('span');nm.className='hname';nm.textContent=h.name;
      var st=document.createElement('span');st.className='streak';
      st.innerHTML=s?FLAME+'<span>'+s+' күн қатарынан</span>':'<span>Бүгін бастаңыз</span>';
      body.append(nm,st);body.addEventListener('click',function(){openSheet(h)});
      row.append(chk,body);box.appendChild(row);
    });
  }

  function phrase(r,n){
    if(!n)return 'Бірінші әдетіңізді қосыңыз';
    if(r===0)return 'Бастайық! Бәйтерегіңізді өсіріңіз';
    if(r<0.5)return 'Жақсы бастама, жалғастырыңыз!';
    if(r<1)return 'Тамаша, аз қалды!';
    return 'Бәрі орындалды! Бәйтерек гүлдеді';
  }

  function renderToday(){
    var k=key(sel),n=state.habits.length,c=doneOn(k).length,r=n?c/n:0;
    $('count').innerHTML=c+' <small>/ '+n+' орындалды</small>';
    $('phrase').textContent=phrase(r,n);
    drawTree(r);renderWeek();renderList();
  }

  function toggle(id,k,el){
    var arr=state.log[k]||(state.log[k]=[]),i=arr.indexOf(id),before=ratio(k);
    if(i>-1)arr.splice(i,1);else arr.push(id);
    if(!arr.length)delete state.log[k];
    save();
    if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
    renderToday();
    var after=ratio(k);
    if(before<1&&after===1)confetti();
    var again=document.querySelectorAll('.check');
    state.habits.forEach(function(h,ix){if(h.id===id&&again[ix]){again[ix].classList.add('pop')}});
  }

  function confetti(){
    var cols=['#E3BC6E','#A3D47E','#F6E2B0','#C9925A','#B5E08F'];
    for(var i=0;i<46;i++){var p=document.createElement('i');p.className='conf';
      p.style.left=Math.random()*100+'vw';p.style.background=cols[i%cols.length];
      p.style.animationDuration=(1.6+Math.random()*1.6)+'s';p.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(p);setTimeout(function(x){return function(){x.remove()}}(p),3800)}
  }

  // ---- sheet ----
  var editing=null,pickColor=COLORS[0];
  (function(){
    var s=$('sugg');SUGG.forEach(function(t){var b=document.createElement('button');b.type='button';b.textContent=t;b.addEventListener('click',function(){$('hname').value=t});s.appendChild(b)});
    var c=$('colors');COLORS.forEach(function(col){var b=document.createElement('button');b.type='button';b.className='sw';b.style.background=col;b.dataset.c=col;b.setAttribute('aria-label','Түс');
      b.addEventListener('click',function(){pickColor=col;markColor()});c.appendChild(b)});
  })();
  function markColor(){document.querySelectorAll('.sw').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.c===pickColor?'true':'false')})}
  function openSheet(h){
    editing=h||null;
    $('sheetTitle').textContent=h?'Әдетті өзгерту':'Жаңа әдет';
    $('hname').value=h?h.name:'';
    pickColor=h?h.color:COLORS[state.habits.length%COLORS.length];markColor();
    $('delBtn').hidden=!h;$('confirm').hidden=true;$('sugg').hidden=!!h;
    $('scrim').classList.add('open');$('sheet').classList.add('open');
    setTimeout(function(){$('hname').focus()},300);
  }
  function closeSheet(){$('scrim').classList.remove('open');$('sheet').classList.remove('open');$('hname').blur()}
  $('addBtn').addEventListener('click',function(){openSheet(null)});
  $('scrim').addEventListener('click',closeSheet);
  $('hform').addEventListener('submit',function(e){
    e.preventDefault();var name=$('hname').value.trim();if(!name)return;
    if(editing){editing.name=name;editing.color=pickColor}
    else state.habits.push({id:uid(),name:name,color:pickColor});
    save();closeSheet();renderToday();
  });
  $('delBtn').addEventListener('click',function(){$('confirm').hidden=false});
  $('noDel').addEventListener('click',function(){$('confirm').hidden=true});
  $('yesDel').addEventListener('click',function(){
    if(!editing)return;var id=editing.id;
    state.habits=state.habits.filter(function(h){return h.id!==id});
    Object.keys(state.log).forEach(function(k){state.log[k]=state.log[k].filter(function(x){return x!==id});if(!state.log[k].length)delete state.log[k]});
    save();closeSheet();renderToday();
  });

  // ---- stats ----
  var viewM=new Date(today().getFullYear(),today().getMonth(),1);
  function renderStats(){
    var y=viewM.getFullYear(),m=viewM.getMonth(),t=today();
    $('monthTitle').textContent=MONTHS[m]+' '+y;
    var cal=$('cal');cal.innerHTML='';
    DAYS_SHORT.forEach(function(d){var h=document.createElement('div');h.className='h';h.textContent=d;cal.appendChild(h)});
    var first=new Date(y,m,1),lead=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
    for(var i=0;i<lead;i++)cal.appendChild(document.createElement('div'));
    var full=0,sumR=0,counted=0;
    for(var d=1;d<=days;d++){
      var dt=new Date(y,m,d),k=key(dt),r=ratio(k),c=document.createElement('div');
      c.className='cell'+(r>=1?' l3':r>=0.5?' l2':r>0?' l1':'')+(k===key(t)?' today':'');
      c.textContent=d;cal.appendChild(c);
      if(dt<=t){counted++;sumR+=r;if(r>=1&&state.habits.length)full++}
    }
    $('tFull').textContent=full;
    $('tPct').textContent=(counted?Math.round(sumR/counted*100):0)+'%';
    var hs=$('hstats');hs.innerHTML='';
    if(!state.habits.length){hs.innerHTML='<p class="empty">Әдеттер қосылғанда статистика осында шығады.</p>';return}
    state.habits.forEach(function(h){
      var cnt=0;for(var d=1;d<=days;d++){var dt=new Date(y,m,d);if(dt<=t&&isDone(h.id,key(dt)))cnt++}
      var pct=counted?Math.round(cnt/counted*100):0;
      var row=document.createElement('div');row.className='hstat';
      row.innerHTML='<span class="dot" style="background:'+h.color+'"></span><div class="nm"><span></span><div class="bar"><i style="width:'+pct+'%;background:'+h.color+'"></i></div></div><div class="nums"><div><b>'+streak(h.id)+'</b>қатар</div><div><b>'+best(h.id)+'</b>рекорд</div></div>';
      row.querySelector('.nm span').textContent=h.name;
      hs.appendChild(row);
    });
  }
  $('prevM').addEventListener('click',function(){viewM=new Date(viewM.getFullYear(),viewM.getMonth()-1,1);renderStats()});
  $('nextM').addEventListener('click',function(){viewM=new Date(viewM.getFullYear(),viewM.getMonth()+1,1);renderStats()});

  // ---- tabs ----
  function show(which){
    var st=which==='stats';
    $('screenToday').hidden=st;$('screenStats').hidden=!st;
    $('tabToday').setAttribute('aria-selected',st?'false':'true');$('tabStats').setAttribute('aria-selected',st?'true':'false');
    if(st)renderStats();else renderToday();
    window.scrollTo(0,0);
  }
  $('tabToday').addEventListener('click',function(){show('today')});
  $('tabStats').addEventListener('click',function(){show('stats')});

  // ---- install hint ----
  var standalone=window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  $('hintText').textContent=ios?'Safari-де «Бөлісу» батырмасын басып, «На экран „Домой“» таңдаңыз.':'Chrome-да ⋮ мәзірін ашып, «Добавить на главный экран» таңдаңыз.';
  $('hintClose').addEventListener('click',function(){$('installHint').hidden=true;state.hint=false;save()});

  // ---- boot ----
  load();
  if(!standalone&&state.hint!==false)$('installHint').hidden=false;
  greet();renderToday();
  document.addEventListener('visibilitychange',function(){if(!document.hidden){greet();if(key(sel)!==key(today())&&sel>today())sel=today();renderToday()}});

  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
})();
</script>

</body></html>
